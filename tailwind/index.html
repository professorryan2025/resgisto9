<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page Tailwind</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<!-- NAVBAR -->
<nav class="bg-gray-900 text-white">
  <div class="max-w-6xl mx-auto px-4 py-3">
    <h1 class="text-xl font-bold">WebSolutions</h1>
  </div>
</nav>

<!-- HERO -->
<div class="max-w-6xl mx-auto text-center mt-10 px-4">
  <h1 class="text-4xl font-bold mb-4">Bem-vindo</h1>
  <p class="text-gray-600 mb-6">Soluções em desenvolvimento web</p>
  <button class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
    Saiba mais
  </button>
</div>

<!-- CARDS -->
<div class="max-w-6xl mx-auto mt-10 px-4">
  <div class="grid md:grid-cols-3 gap-6">

    <!-- Card 1 -->
    <div class="bg-white rounded-lg shadow">
      <img src="" class="w-full h-48 object-cover rounded-t-lg">
      <div class="p-4">
        <h5 class="text-lg font-semibold">Serviço 1</h5>
        <p class="text-gray-600">Descrição</p>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="bg-white rounded-lg shadow">
      <img src="" class="w-full h-48 object-cover rounded-t-lg">
      <div class="p-4">
        <h5 class="text-lg font-semibold">Serviço 2</h5>
        <p class="text-gray-600">Descrição</p>
      </div>
    </div>

  </div>
</div>

<!-- FOOTER -->
<footer class="text-center mt-10 py-4 text-gray-600">
  <p>© 2024 WebSolutions</p>
</footer>

</body>
</html>
